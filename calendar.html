<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeonSync - Calendar</title>
    <link rel="icon" type="image/png" href="NS_logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    
    <!-- FullCalendar -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>

    <link rel="stylesheet" href="./main.css" />
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('neonsync-theme') || 'dark');</script>
    <style>
      /* ─── FullCalendar: Global resets ─────────────────────────────── */
      .fc-theme-standard td,
      .fc-theme-standard th,
      .fc-theme-standard .fc-scrollgrid {
        border-color: var(--border-glass) !important;
      }
      .fc {
        --fc-border-color: var(--border-glass);
        --fc-page-bg-color: transparent;
        --fc-neutral-bg-color: transparent;
        --fc-today-bg-color: rgba(0, 242, 255, 0.06);
        --fc-list-event-hover-bg-color: rgba(255,255,255,0.04);
        --fc-highlight-color: rgba(0, 242, 255, 0.08);
        --fc-non-business-color: transparent;
        --fc-bg-event-opacity: 0.15;
        --fc-now-indicator-color: var(--blue, #00f2ff);
      }

      /* ─── Remove ALL white/lavender backgrounds ───────────────────── */
      .fc .fc-timegrid-col.fc-day,
      .fc .fc-timegrid-slot,
      .fc .fc-timegrid-slot-lane,
      .fc .fc-timegrid-col-bg,
      .fc .fc-timegrid-body,
      .fc .fc-daygrid-body,
      .fc .fc-daygrid-day,
      .fc .fc-scrollgrid-section,
      .fc .fc-scrollgrid-section > td,
      .fc .fc-scrollgrid-sync-table,
      .fc .fc-col-header,
      .fc .fc-col-header-cell,
      .fc .fc-timegrid-axis,
      .fc .fc-timegrid-divider,
      .fc .fc-daygrid-day-bg,
      .fc td, .fc th {
        background: transparent !important;
      }

      /* Today column — subtle neon tint, NOT white */
      .fc .fc-day-today {
        background: rgba(0, 242, 255, 0.04) !important;
      }

      /* ─── Text colors ─────────────────────────────────────────────── */
      .fc .fc-col-header-cell-cushion,
      .fc .fc-daygrid-day-number,
      .fc .fc-timegrid-axis-cushion,
      .fc .fc-timegrid-slot-label-cushion,
      .fc .fc-list-day-text,
      .fc .fc-list-day-side-text {
        color: var(--text-primary) !important;
        text-decoration: none !important;
      }
      .fc .fc-toolbar-title {
        color: var(--text-primary) !important;
      }

      /* ─── Buttons ─────────────────────────────────────────────────── */
      .fc .fc-button-primary {
        background: var(--bg-panel) !important;
        border-color: var(--border-glass) !important;
        color: var(--text-primary) !important;
        text-transform: capitalize !important;
        font-size: 13px !important;
      }
      .fc .fc-button-primary:hover {
        background: rgba(255, 255, 255, 0.05) !important;
      }
      .fc .fc-button-active {
        background: var(--blue) !important;
        border-color: var(--blue) !important;
        color: #000 !important;
        font-weight: 600 !important;
      }

      /* ─── Events ──────────────────────────────────────────────────── */
      .fc-event {
        cursor: pointer;
        border-radius: 4px;
        padding: 2px 4px;
        font-size: 11px;
        border: none !important;
      }
      .fc-daygrid-event,
      .fc-event-main,
      .fc-event-main-frame {
        display: flex !important;
        flex-direction: row !important;
        align-items: center !important;
        width: 100% !important;
        justify-content: flex-start !important; /* Let margins do the work */
      }
      .fc-event-title {
        order: 1 !important;
        white-space: normal !important;
        word-break: break-word !important;
        line-height: 1.2 !important;
        font-weight: 600 !important;
        font-size: 11px !important;
        flex: 1 !important; /* Grow to take space */
      }
      .fc-event-time {
        order: 2 !important;
        font-weight: 700 !important;
        font-size: 9.5px !important;
        opacity: 0.7;
        flex-shrink: 0 !important;
        margin-left: auto !important; /* THE KEY: Push to extreme right */
        padding-left: 8px !important;
      }

      /* Mobile specific event layout: Stack to allow full wrapping */
      @media (max-width: 767px) {
        .fc-daygrid-event,
        .fc-event-main,
        .fc-event-main-frame {
          flex-direction: column !important;
          align-items: flex-start !important;
          gap: 2px !important;
        }
        .fc-event-time {
          margin-left: 0 !important;
          padding-left: 0 !important;
          order: 1 !important;
          margin-bottom: 2px !important;
        }
        .fc-event-title {
          order: 2 !important;
          font-size: 10px !important;
        }
      }
      .fc-event-task {
        background: rgba(16, 185, 129, 0.15) !important;
        color: #10b981 !important;
        border-left: 3px solid #10b981 !important;
      }
      .fc-event-custom {
        background: rgba(139, 92, 246, 0.15) !important;
        color: #8b5cf6 !important;
        border-left: 3px solid #8b5cf6 !important;
      }
      .fc-event-overdue {
        background: rgba(239, 68, 68, 0.15) !important;
        color: #ef4444 !important;
        border-left: 3px solid #ef4444 !important;
      }
      .fc-event-completed {
        background: rgba(156, 163, 175, 0.15) !important;
        color: #9ca3af !important;
        border-left: 3px solid #9ca3af !important;
        text-decoration: line-through !important;
      }
      /* Event text inside time/day blocks */
      .fc-event .fc-event-main {
        color: inherit !important;
      }

      /* ─── Light mode overrides ────────────────────────────────────── */
      [data-theme="light"] .fc .fc-button-primary {
        background: #f0f1f4 !important;
        border-color: rgba(0,0,0,0.12) !important;
        color: #1a1c23 !important;
      }
      [data-theme="light"] .fc .fc-button-primary:hover {
        background: #e4e6eb !important;
      }
      [data-theme="light"] .fc .fc-button-active {
        background: #0099aa !important;
        border-color: #0099aa !important;
        color: #ffffff !important;
      }
      [data-theme="light"] .fc .fc-day-today {
        background: rgba(0, 150, 200, 0.06) !important;
      }
      [data-theme="light"] .fc .fc-col-header-cell-cushion,
      [data-theme="light"] .fc .fc-daygrid-day-number,
      [data-theme="light"] .fc .fc-timegrid-axis-cushion,
      [data-theme="light"] .fc .fc-timegrid-slot-label-cushion,
      [data-theme="light"] .fc .fc-list-day-text,
      [data-theme="light"] .fc .fc-list-day-side-text {
        color: #1a1c23 !important;
      }
      [data-theme="light"] .fc .fc-toolbar-title {
        color: #1a1c23 !important;
      }
      [data-theme="light"] .fc-theme-standard td,
      [data-theme="light"] .fc-theme-standard th,
      [data-theme="light"] .fc-theme-standard .fc-scrollgrid {
        border-color: rgba(0,0,0,0.08) !important;
      }

      /* ─── Modals ──────────────────────────────────────────────────── */
      .attachment-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border-glass);
        border-radius: 6px;
        color: var(--text-primary);
        text-decoration: none;
        font-size: 12px;
        transition: all 0.2s ease;
      }
      .attachment-chip:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: var(--blue);
      }

      /* ─── Event Action Grid ────────────────────────────────────────── */
      .event-actions-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid var(--border-glass);
        width: 100%;
      }
      .event-actions-grid .btn {
        justify-content: center;
        width: 100%;
        font-size: 12px; /* Slightly smaller to fit label comfortably */
        padding: 8px 10px;
      }
      .event-actions-grid .btn:last-child:nth-child(odd) {
        grid-column: span 2;
      }

      /* ─── Mobile Responsiveness ───────────────────────────────────── */
      @media (max-width: 768px) {
        /* Make toolbar stack nicely */
        .fc .fc-toolbar {
          flex-direction: column;
          gap: 8px;
          align-items: center !important;
        }
        .fc .fc-toolbar-title {
          font-size: 1.25rem !important;
          text-align: center;
        }
        .fc .fc-toolbar-chunk {
          display: flex;
          justify-content: center;
          width: 100%;
        }
        /* Enable horizontal scrolling for the calendar grid */
        .fc-view-harness {
          overflow-x: auto !important;
          min-height: 0 !important;
          height: auto !important;
        }
        .fc-scrollgrid {
          min-width: 600px !important;
        }
        /* Adjust padding of the container */
        .calendar-wrapper {
          padding: 12px !important;
        }
        /* Fix blank space below calendar */
        .calendar-main-area {
          min-height: auto !important;
          height: auto !important;
        }
        #calendar-view {
          flex: 0 1 auto;
        }
        .fc-view-harness {
          height: auto !important;
        }
        .fc .fc-scroller {
          overflow: visible !important;
          height: auto !important;
        }
        .fc .fc-scroller-liquid-absolute {
          position: relative !important;
        }
      }
      /* ─── Side Panel & Bottom Sheet Layout ──────────────────────── */
      .calendar-layout-container {
        display: flex;
        align-items: stretch;
        flex: 1;
        animation: fadeInUp 0.5s ease 0.1s both;
      }
      .calendar-main-area {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg-panel);
        border: 1px solid var(--border-glass);
        border-radius: var(--radius-lg);
        padding: 20px;
        min-height: 600px;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                    flex 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #calendar-view {
        flex: 1;
      }
      /* Subtle slide for the calendar when panel is active */
      .calendar-layout-container:has(.calendar-side-panel.active) .calendar-main-area {
        transform: translateX(-5px);
      }

      .calendar-side-panel {
        display: flex; 
        width: 0;
        opacity: 0;
        visibility: hidden;
        margin-left: 0;
        flex-shrink: 0;
        background: var(--bg-panel);
        border: 1px solid var(--border-glass);
        border-radius: var(--radius-lg);
        height: 600px;
        flex-direction: column;
        box-shadow: var(--shadow-lg);
        transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                    opacity 0.3s ease, 
                    margin-left 0.3s ease,
                    visibility 0.3s;
        overflow: hidden;
      }
      .calendar-side-panel.active {
        width: 340px;
        opacity: 1;
        visibility: visible;
        margin-left: 20px;
      }
      
      /* Entrance Animations */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeInDown {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .page-header { animation: fadeInDown 0.5s ease both; }
      .calendar-layout-container { animation: fadeInUp 0.5s ease 0.1s both; }
      .side-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border-glass);
      }
      .side-panel-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--text-primary);
      }
      .side-panel-close {
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.2s;
      }
      .side-panel-close:hover {
        color: var(--text-primary);
      }
      .side-panel-content {
        padding: 20px;
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }
      /* Mobile overlay */
      .calendar-side-panel-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.3);
        z-index: 999;
        backdrop-filter: blur(2px);
        opacity: 0;
        transition: opacity 0.3s;
      }
      /* Only show overlay and blur on mobile */
      @media (max-width: 1200px) {
        .calendar-side-panel-overlay.active {
          display: block;
          opacity: 1;
        }
      }

      /* Responsive rules for side panel -> bottom sheet */
      @media (max-width: 1200px) {
        .calendar-layout-container {
          display: block; /* revert flex */
        }
        .calendar-main-area {
          margin-bottom: 20px;
          min-height: auto !important;
          padding: 10px;
        }
        .calendar-side-panel {
          display: flex !important; 
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          width: 100% !important;
          height: 80vh; 
          opacity: 0 !important; /* Hide by default */
          visibility: hidden !important; /* Hide by default */
          margin-left: 0 !important;
          border-radius: 20px 20px 0 0;
          border: none;
          border-top: 1px solid var(--border-glass);
          z-index: 9999;
          background: var(--bg-surface);
          transform: translateY(100%);
          transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                      opacity 0.3s ease,
                      visibility 0.3s;
          box-shadow: 0 -10px 40px rgba(0,0,0,0.4);
        }
        .calendar-side-panel.active {
          opacity: 1 !important;
          visibility: visible !important;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>

    <!-- Layout -->
    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Mobile top bar -->
    <div class="mobile-topbar" id="mobile-topbar">
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open menu">
        <i class="ph ph-list"></i>
      </button>
      <div class="mobile-logo">
        <div class="mobile-logo-icon"><i class="ph ph-circles-four"></i></div>
        <span class="mobile-logo-text">NeonSync</span>
      </div>
      <div style="width:36px"></div>
    </div>

    <div class="app-layout" id="app">
      <!-- Sidebar -->
      <div id="sidebar" class="sidebar"></div>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Header -->
        <div class="page-header">
          <div>
            <h1 class="page-title">Calendar</h1>
            <p class="page-subtitle">View tasks and personal events</p>
          </div>

          <button class="btn btn-primary" onclick="openNewEventModal()">
            <i class="ph ph-plus"></i> New Event
          </button>
        </div>

        <!-- Calendar Layout Container -->
        <div class="calendar-layout-container">
          <!-- Calendar Main Area -->
          <div class="calendar-main-area">
            <div id="calendar-view"></div>
          </div>
          
          <!-- Side Panel Overlay (Mobile) -->
          <div class="calendar-side-panel-overlay" id="calendar-side-panel-overlay" onclick="closeSidePanel()"></div>

          <!-- Side Panel / Bottom Sheet -->
          <div class="calendar-side-panel" id="calendar-side-panel">
            <div class="side-panel-header">
              <span class="side-panel-title" id="sp-title">Details</span>
              <button class="side-panel-close" onclick="closeSidePanel()">
                <i class="ph ph-x"></i>
              </button>
            </div>
            
            <div class="side-panel-content" id="sp-content">
              <!-- Content injected via JS -->
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- New Event Modal -->
    <div class="modal-overlay" id="event-modal">
      <div class="modal">
        <div class="modal-header">
          <span class="modal-title">Create New Event</span>
          <button class="modal-close" onclick="closeModal('event-modal')">
            <i class="ph ph-x"></i>
          </button>
        </div>

        <form id="event-form" onsubmit="submitEvent(event)">
          <input type="hidden" id="ev-id" />
          
          <div class="form-group">
            <label class="form-label">Title *</label>
            <input type="text" id="ev-title" class="form-input" required />
          </div>

          <div class="form-group">
            <label class="form-label">Description</label>
            <textarea id="ev-desc" class="form-input" rows="3"></textarea>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Start *</label>
              <input type="datetime-local" id="ev-start" class="form-input" required />
            </div>

            <div class="form-group">
              <label class="form-label">End *</label>
              <input type="datetime-local" id="ev-end" class="form-input" required />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Visibility Scope</label>
            <select id="ev-visibility" class="form-input">
              <option value="private">Private (Only me)</option>
              <option value="all">Everyone (Team)</option>
              <option value="admin">Admins Only</option>
            </select>
          </div>

          <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px;">
            <button type="button" class="btn btn-secondary" onclick="closeModal('event-modal')">Cancel</button>
            <button type="submit" id="event-form-submit" class="btn btn-primary">
              <i class="ph ph-check"></i> Save Event
            </button>
          </div>
        </form>
      </div>
    </div>



    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="./calendar.js"></script>
  </body>
</html>
