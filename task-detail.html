<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeonSync - Task Detail</title>
    <link rel="icon" type="image/png" href="NS_logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="./main.css" />
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('neonsync-theme') || 'dark');</script>
    <style>


      /* Task detail page header: nowrap on desktop, wrap on mobile */
      @media (min-width: 768px) {
        .page-header { flex-wrap: nowrap !important; align-items: flex-start !important; }
      }
      @media (max-width: 767px) {
        .page-header { flex-wrap: wrap !important; }
        .page-header > div:first-child { flex-wrap: wrap; gap: 8px; }
        #task-action-btns { flex-wrap: wrap; gap: 6px; margin-top: 0 !important; }
      }

      /* Edit modal: inline grid collapses on mobile */
      @media (max-width: 479px) {
        #edit-task-modal [style*="grid-template-columns: 1fr 1fr"] {
          grid-template-columns: 1fr !important;
        }
        .task-detail-grid > div:last-child > .card {
          height: auto !important;
          min-height: 300px;
        }
      }

      /* Attachment inputs stack on mobile */
      @media (max-width: 479px) {
        #attachments-list + div { flex-direction: column; }
        #attachments-list + div .form-input { flex: 1 1 100% !important; }
      }
    </style>
  </head>

  <body>

    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Mobile top bar -->
    <div class="mobile-topbar" id="mobile-topbar">
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open menu">
        <i class="ph ph-list"></i>
      </button>
      <div class="mobile-logo">
        <div class="mobile-logo-icon"><i class="ph ph-circles-four"></i></div>
        <span class="mobile-logo-text">NeonSync</span>
      </div>
      <div style="width:36px"></div>
    </div>

    <div class="app-layout" id="app">
      <div id="sidebar" class="sidebar"></div>

      <main class="main-content">
        <div class="page-header" style="flex-wrap: nowrap; align-items: flex-start;">
          <div style="display: flex; align-items: flex-start; gap: 12px; min-width: 0; flex: 1;">
            <a href="tasks.html" class="btn btn-secondary btn-sm" style="flex-shrink: 0; margin-top: 8px;">
              <i class="ph ph-arrow-left"></i> Back
            </a>

            <div style="min-width: 0;">
              <h1
                class="page-title"
                id="task-title-display"
                data-testid="task-title-display"
                style="word-wrap: break-word; line-height: 1.2;"
              >
                Loading...
              </h1>
              <p class="page-subtitle" id="task-meta-display"></p>
            </div>
          </div>

          <div style="display: flex; gap: 8px; flex-shrink: 0; margin-top: 8px; flex-wrap: wrap; justify-content: flex-end;" id="task-action-btns">
            <button
              class="btn btn-secondary btn-sm"
              id="share-task-btn"
              onclick="shareTaskLink()"
            >
              <i class="ph ph-share-network"></i> Share
            </button>

            <button
              class="btn btn-secondary btn-sm"
              id="edit-task-btn"
              onclick="openEditModal()"
              style="display: none"
            >
              <i class="ph ph-pencil"></i> Edit
            </button>

            <button
              class="btn btn-secondary btn-sm"
              id="toggle-close-task-btn"
              onclick="toggleCloseTask()"
              style="display: none"
            >
              <i class="ph ph-lock-key" id="toggle-close-icon"></i> <span id="toggle-close-text">Close Task</span>
            </button>

            <button
              class="btn btn-danger btn-sm"
              id="delete-task-btn"
              onclick="deleteTask()"
              style="display: none"
            >
              <i class="ph ph-trash"></i> Delete
            </button>
          </div>
        </div>

        <div class="task-detail-grid">
          <!-- LEFT SIDE -->

          <div>
            <!-- TASK INFO -->

            <div class="card mb-4 animate-in">
              <div
                style="
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  margin-bottom: 16px;
                  flex-wrap: wrap;
                  gap: 10px;
                "
              >
                <div
                  style="display: flex; gap: 8px; flex-wrap: wrap"
                  id="task-badges"
                ></div>

                <div
                  style="display: flex; align-items: center; gap: 10px"
                  id="status-controls"
                >
                  <label style="font-size: 12px; color: var(--text-secondary)"
                    >Status:</label
                  >

                  <select
                    id="status-select"
                    class="form-input form-select"
                    style="max-width: 160px; padding: 7px 32px 7px 10px"
                    onchange="updateStatus(this.value)"
                  >
                    <option value="pending">Pending</option>
                    <option value="in-progress">In Progress</option>
                    <option value="review">Review</option>
                    <option value="completed">Completed</option>
                  </select>
                </div>
              </div>

              <p
                id="task-description"
                class="text-secondary mb-4"
                style="font-size: 14px; line-height: 1.6; white-space: pre-wrap;"
              ></p>

              <div id="reference-links-section" style="margin-bottom: 24px; display: none;">
                <div class="text-sm text-muted mb-2">Reference Links</div>
                <div id="reference-links-list" style="display:flex; flex-direction:column; gap:8px;"></div>
              </div>

              <div class="grid-2 mb-4">
                <div>
                  <div class="text-sm text-muted mb-2">Created By</div>
                  <div id="task-creator"></div>
                </div>

                <div>
                  <div class="text-sm text-muted mb-2">Deadline</div>
                  <div id="task-deadline-display"></div>
                </div>
              </div>

              <div class="mb-4">
                <div class="text-sm text-muted mb-2">Assigned To</div>

                <div
                  id="task-assignees"
                  style="display: flex; gap: 8px; flex-wrap: wrap"
                ></div>
              </div>

              <div id="completion-control" style="display: none">
                <div style="display: flex; justify-content: space-around; flex-wrap: wrap; gap: 20px;">
                  <!-- Personal Completion -->
                  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; flex: 1; min-width: 150px;">
                    <div class="text-sm text-muted" style="margin-bottom: 4px;" id="personal-progress-title">Your Progress</div>
                    <div class="completion-ring-container">
                      <svg class="completion-ring" viewBox="0 0 120 120">
                        <circle class="completion-ring-bg" cx="60" cy="60" r="52" />
                        <circle class="completion-ring-fill" id="completion-ring-fill" cx="60" cy="60" r="52"
                          stroke-dasharray="326.73" stroke-dashoffset="326.73" />
                      </svg>
                      <div class="completion-ring-label" id="completion-pct-label">0%</div>
                    </div>
                    <div class="completion-stepper" style="width: 100%; max-width: 160px;" id="personal-stepper-wrap">
                      <input type="range" id="completion-input" class="form-range" min="0" max="100" value="0" step="5"
                        oninput="previewFromInput(this.value)" onchange="commitFromInput(this.value)" style="width: 100%; cursor: pointer;" />
                    </div>
                  </div>

                  <!-- Total Completion -->
                  <div id="total-progress-section" style="display: flex; flex-direction: column; align-items: center; gap: 14px; flex: 1; min-width: 150px;">
                    <div class="text-sm text-muted" style="margin-bottom: 4px;">Total Progress</div>
                    <div class="completion-ring-container" style="transform: scale(0.9);">
                      <svg class="completion-ring" viewBox="0 0 120 120">
                        <circle class="completion-ring-bg" cx="60" cy="60" r="52" />
                        <circle class="completion-ring-fill" id="total-ring-fill" cx="60" cy="60" r="52"
                          stroke-dasharray="326.73" stroke-dashoffset="326.73" />
                      </svg>
                      <div class="completion-ring-label" id="total-pct-label" style="font-size: 20px;">0%</div>
                    </div>
                    <div class="text-sm text-muted" id="total-status-label" style="font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 1px;">Pending</div>
                  </div>
                </div>
                <input type="hidden" id="completion-slider" value="0" />
              </div>
            </div>

            <!-- TAGS -->
            <div
              id="tags-card"
              class="card mb-4 animate-in"
              style="display: none"
            >
              <div class="section-header">
                <span class="section-title">Tags</span>
              </div>
              <div
                id="task-tags-display"
                style="display: flex; flex-wrap: wrap; gap: 6px"
              ></div>
            </div>

            <!-- REMARKS -->

            <div class="card mb-4 animate-in">
              <div class="section-header">
                <span class="section-title"
                  >Remarks
                  <span
                    id="remarks-count"
                    style="
                      font-size: 12px;
                      color: var(--text-muted);
                      font-weight: 400;
                    "
                  ></span
                ></span>
              </div>

              <div id="remarks-list"></div>

              <div style="display: flex; gap: 10px; margin-top: 12px">
                <textarea
                  id="remark-text"
                  class="form-input"
                  placeholder="Add a remark..."
                  rows="2"
                  style="flex: 1"
                >
                </textarea>

                <button class="btn btn-primary btn-sm" onclick="addRemark()">
                  <i class="ph ph-paper-plane-tilt"></i>
                </button>
              </div>
            </div>

            <!-- ATTACHMENTS -->

            <div class="card animate-in">
              <div class="section-header">
                <span class="section-title">Attachments</span>
              </div>

              <div id="attachments-list" style="margin-bottom: 12px"></div>

              <div style="display: flex; gap: 8px; flex-wrap: wrap">
                <input
                  type="text"
                  id="attach-name"
                  class="form-input"
                  placeholder="File name"
                  style="flex: 1"
                />

                <input
                  type="url"
                  id="attach-url"
                  class="form-input"
                  placeholder="https://..."
                  style="flex: 2"
                />

                <button
                  class="btn btn-secondary btn-sm"
                  onclick="addAttachment()"
                >
                  <i class="ph ph-link"></i> Add
                </button>
              </div>
            </div>
          </div>

          <!-- ACTIVITY LOG -->
          <div class="card animate-in" style="margin-top: 16px">
            <div class="section-header">
              <span class="section-title">Activity Log</span>
            </div>
            <div id="task-logs"></div>
          </div>

        </div>
      </main>
    </div>

    <!-- Edit Task Modal -->
    <div class="modal-overlay" id="edit-task-modal">
      <div class="modal" style="max-width: 520px">
        <div class="modal-header">
          <h3 class="modal-title">Edit Task</h3>
          <button class="modal-close" onclick="closeModal('edit-task-modal')">
            <i class="ph ph-x"></i>
          </button>
        </div>
        <form onsubmit="submitEditTask(event)">
          <div
            class="modal-body"
            style="display: flex; flex-direction: column; gap: 14px"
          >
            <div class="form-group">
              <label class="form-label">Title</label>
              <input
                id="edit-title"
                type="text"
                class="form-input"
                placeholder="Task title"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label">Description</label>
              <textarea
                id="edit-desc"
                class="form-input"
                rows="3"
                placeholder="Description..."
              ></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">Reference Links</label>
              <div id="edit-tf-reference-links-list" style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px;"></div>
              <div style="display:flex; gap:8px;">
                <input type="text" id="edit-tf-ref-title" class="form-input" placeholder="Title" style="flex:1" />
                <input type="url" id="edit-tf-ref-url" class="form-input" placeholder="URL" style="flex:2" />
                <button type="button" class="btn btn-secondary btn-sm" onclick="addEditFormReferenceLink()">Add</button>
              </div>
            </div>

            <div
              style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px"
            >
              <div class="form-group">
                <label class="form-label">Priority</label>
                <select id="edit-priority" class="form-input form-select">
                  <option value="low">Low</option>
                  <option value="medium" selected>Medium</option>
                  <option value="high">High</option>
                  <option value="critical">Critical</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Deadline</label>
                <input
                  id="edit-deadline"
                  type="datetime-local"
                  class="form-input"
                />
              </div>
            </div>

            <div class="form-group" id="edit-assign-group">
              <label class="form-label">Assign To</label>
              <input
                type="text"
                id="edit-assign-search"
                class="form-input"
                placeholder="Search users..."
                oninput="searchEditAssignees(this.value)"
                onfocus="searchEditAssignees('')"
              />
              <div
                id="edit-assignee-results"
                style="
                  max-height: 150px;
                  overflow-y: auto;
                  margin-top: 6px;
                  border: 1px solid var(--border-glass);
                  border-radius: var(--radius-md);
                  display: none;
                  background: var(--bg-panel); border-color: var(--border-hover) !important;
                "
              ></div>
              <div
                id="edit-selected-assignees"
                style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px"
              ></div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              onclick="closeModal('edit-task-modal')"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>

    <!-- User Progress Override Modal -->
    <div class="modal-overlay" id="user-progress-modal">
      <div class="modal" style="max-width: 400px; text-align: center;">
        <div class="modal-header">
          <h3 class="modal-title">Update Progress for <span id="override-user-name"></span></h3>
          <button class="modal-close" onclick="closeModal('user-progress-modal')">
            <i class="ph ph-x"></i>
          </button>
        </div>
        <div class="modal-body" style="padding: 24px;">
          <div class="completion-ring-wrap" style="flex-direction: column; align-items: center; gap: 20px;">
            <div class="completion-ring-container">
              <svg class="completion-ring" viewBox="0 0 120 120">
                <circle class="completion-ring-bg" cx="60" cy="60" r="52" />
                <circle class="completion-ring-fill" id="override-ring-fill" cx="60" cy="60" r="52"
                  stroke-dasharray="326.73" stroke-dashoffset="326.73" />
              </svg>
              <div class="completion-ring-label" id="override-pct-label">0%</div>
            </div>
            <div class="completion-stepper" style="width: 100%;">
              <input type="range" id="override-completion-input" class="form-range" min="0" max="100" value="0" step="5"
                oninput="updateOverridePreview(this.value)" style="width: 100%; cursor: pointer;" />
            </div>
          </div>
          <input type="hidden" id="override-user-id" value="" />
        </div>
        <div class="modal-footer" style="justify-content: center;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('user-progress-modal')">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="saveUserProgressOverride()">Save Progress</button>
        </div>
      </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="./task-detail.js"></script>

  </body>
</html>
